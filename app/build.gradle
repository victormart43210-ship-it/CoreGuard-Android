// Real Android application build is the default.
// Opt out only with -Pcoreguard.androidBuild=false (or COREGUARD_ANDROID_BUILD=false)
// for generatePlaceholderArtifact — never for assemble*.
//
// Plugin versions are centralized in the root build.gradle.kts (apply false) and
// gradle/libs.versions.toml. This module applies plugins without repeating versions.

plugins {
    id "com.android.application" apply false
    id "org.jetbrains.kotlin.android" apply false
    id "org.jetbrains.kotlin.kapt" apply false
}

def resolveAndroidBuildEnabled() {
    def prop = (
        findProperty("coreguard.androidBuild")
            ?: System.getenv("COREGUARD_ANDROID_BUILD")
            ?: "true"
    ).toString().trim()
    return !prop.equalsIgnoreCase("false")
}

def enableAndroidBuild = resolveAndroidBuildEnabled()

if (enableAndroidBuild) {
    apply plugin: "com.android.application"
    apply plugin: "org.jetbrains.kotlin.android"
    apply plugin: "org.jetbrains.kotlin.kapt"
    apply from: rootProject.file("gradle/android-app.gradle")
} else {
    apply from: rootProject.file("gradle/android-offline.gradle")
}
