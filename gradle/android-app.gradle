// Plugin classpath + apply are owned by app/build.gradle so AGP resolves on the
// project PluginManager. This script only configures the Android project.
// kotlin-kapt is applied from app/build.gradle for Room annotation processing.

android {
    namespace "com.coldboar.coreguard"
    compileSdk 35

    defaultConfig {
        applicationId "com.coldboar.coreguard"
        minSdk 24
        targetSdk 35
        versionCode 18
        versionName "1.0.17"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    ndkVersion "26.1.10909125"

    // Prefer CI env secrets; fall back to local gitignored keystore.properties.
    // Variable names (authoritative): SIGNING_STORE_FILE, SIGNING_STORE_PASSWORD,
    // SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD, EXPECTED_CERT_SHA256.
    def localKeystoreProps = new Properties()
    def localKeystoreFile = rootProject.file("keystore.properties")
    if (localKeystoreFile.exists()) {
        localKeystoreFile.withInputStream { localKeystoreProps.load(it) }
    }

    def storeFilePath = System.getenv("SIGNING_STORE_FILE") ?: localKeystoreProps.getProperty("storeFile")
    def storePass = System.getenv("SIGNING_STORE_PASSWORD") ?: localKeystoreProps.getProperty("storePassword")
    def signingKeyAlias = System.getenv("SIGNING_KEY_ALIAS") ?: localKeystoreProps.getProperty("keyAlias")
    def signingKeyPass = System.getenv("SIGNING_KEY_PASSWORD") ?: localKeystoreProps.getProperty("keyPassword")

    def signingFields = [storeFilePath, storePass, signingKeyAlias, signingKeyPass]
    def signingPresentCount = signingFields.count { it != null && it.toString().trim() }
    if (signingPresentCount > 0 && signingPresentCount < 4) {
        throw new GradleException(
            "Release signing is partially configured (${signingPresentCount}/4 of " +
                "SIGNING_STORE_FILE, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD). " +
                "Provide all four, or none (debug/local unsigned exploration only)."
        )
    }
    def hasReleaseSigning = signingPresentCount == 4

    // Play App Signing: EXPECTED_CERT_SHA256 should be the *installed* app-signing
    // certificate fingerprint from Play Console (not necessarily the upload key).
    // Debug builds use the debug cert; upload key is only for Play Console uploads.
    def expectedCert = System.getenv("EXPECTED_CERT_SHA256") ?: localKeystoreProps.getProperty("expectedCertSha256") ?: ""
    if ((expectedCert == null || expectedCert.trim().isEmpty()) && hasReleaseSigning) {
        def ksFile = rootProject.file(storeFilePath)
        if (ksFile.exists()) {
            try {
                // Pass password via stdin-env style args; never log password values.
                def pb = new ProcessBuilder(
                    "keytool", "-list", "-v",
                    "-keystore", ksFile.absolutePath,
                    "-alias", signingKeyAlias,
                    "-storepass", storePass
                )
                pb.redirectErrorStream(true)
                def proc = pb.start()
                def out = proc.inputStream.getText("UTF-8")
                proc.waitFor()
                def matcher = (out =~ /SHA256:\s*([0-9A-Fa-f:]+)/)
                if (matcher.find()) {
                    expectedCert = matcher.group(1).trim().toUpperCase()
                    logger.lifecycle("Derived EXPECTED_CERT_SHA256 from keystore alias=${signingKeyAlias}")
                }
            } catch (Exception e) {
                logger.warn("Could not derive EXPECTED_CERT_SHA256 (details omitted)")
            }
        }
    }
    expectedCert = (expectedCert ?: "").trim()
    android.defaultConfig.buildConfigField "String", "EXPECTED_CERT_SHA256", "\"${expectedCert}\""

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(storeFilePath)
                storePassword storePass
                keyAlias signingKeyAlias
                keyPassword signingKeyPass
            }
        }
    }

    // Optional lean ABI for emulator CI: -Pcoreguard.emulatorAbi=x86_64
    def emulatorAbi = (findProperty("coreguard.emulatorAbi") ?: "").toString().trim()
    if (!emulatorAbi.isEmpty()) {
        defaultConfig.ndk.abiFilters.clear()
        defaultConfig.ndk.abiFilters.add(emulatorAbi)
        logger.lifecycle("Using emulator ABI filter: ${emulatorAbi}")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
            def releaseCfg = signingConfigs.findByName("release")
            if (releaseCfg != null) {
                signingConfig releaseCfg
            }
            // Native symbols for Play Console crash deobfuscation / NDK crashes.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.15"
    }

    // Keep app bytecode on Java 17 even when Gradle itself runs on a newer host JDK.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Unit tests run on the JVM without the Android framework. Stub Log/etc. and
    // provide a real org.json implementation so JSONObject is usable in tests.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Fail configuration when production signing is required but missing.
// Set COREGUARD_REQUIRE_RELEASE_SIGNING=true in CI release jobs.
def requireReleaseSigning = (
    System.getenv("COREGUARD_REQUIRE_RELEASE_SIGNING") ?: "false"
).toString().equalsIgnoreCase("true")
def releaseSigningReady = android.signingConfigs.findByName("release") != null
if (requireReleaseSigning && !releaseSigningReady) {
    throw new GradleException(
        "COREGUARD_REQUIRE_RELEASE_SIGNING=true but release signing credentials are absent. " +
            "Configure SIGNING_STORE_FILE / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD."
    )
}

// Verify a debug APK is not an offline placeholder (CI gate helper).
tasks.register("verifyNoPlaceholderApk") {
    group = "verification"
    description = "Fails if app-debug.apk looks like the old offline placeholder ZIP."
    doLast {
        def apk = file("${project.layout.buildDirectory.get().asFile}/outputs/apk/debug/app-debug.apk")
        if (!apk.exists()) {
            throw new GradleException("Missing debug APK at ${apk}. Run :app:assembleDebug first.")
        }
        def meta = file("${project.layout.buildDirectory.get().asFile}/outputs/apk/debug/output-metadata.json")
        if (meta.exists() && meta.text.contains("\"offlineFallback\": true")) {
            throw new GradleException("Placeholder/offline APK detected — refusing to accept fake artifact.")
        }
        // Placeholder ZIPs were tiny; real debug APKs with native libs are much larger.
        if (apk.length() < 100_000L) {
            throw new GradleException(
                "Debug APK is suspiciously small (${apk.length()} bytes). " +
                    "Refusing possible placeholder artifact."
            )
        }
        logger.lifecycle("verifyNoPlaceholderApk OK (${apk.length()} bytes)")
    }
}
tasks.matching { it.name == "assembleDebug" }.configureEach {
    finalizedBy("verifyNoPlaceholderApk")
}

dependencies {
    implementation project(":core:model")

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.navigation:navigation-compose:2.7.7"

    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

    implementation "androidx.biometric:biometric:1.1.0"

    // Google Play Billing Library
    implementation "com.android.billingclient:billing-ktx:7.1.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.3.1"
    // Real org.json for JVM unit tests (android.jar stubs throw by default).
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"

    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
}
