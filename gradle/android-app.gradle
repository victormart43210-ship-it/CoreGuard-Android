// Plugin classpath + apply are owned by app/build.gradle so AGP resolves on the
// project PluginManager. This script only configures the Android project.
// kotlin-kapt is applied from app/build.gradle for Room annotation processing.

android {
    namespace "com.coldboar.coreguard"
    compileSdk 35

    defaultConfig {
        applicationId "com.coldboar.coreguard"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Set EXPECTED_CERT_SHA256 to the colon-hex SHA-256 of the upload/signing
        // cert before production release (CI secret or local env). Empty = WARN.
        def expectedCert = System.getenv("EXPECTED_CERT_SHA256") ?: ""
        buildConfigField "String", "EXPECTED_CERT_SHA256", "\"${expectedCert}\""

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    ndkVersion "26.1.10909125"

    def storeFile = System.getenv("SIGNING_STORE_FILE")
    def storePass = System.getenv("SIGNING_STORE_PASSWORD")
    def signingKeyAlias = System.getenv("SIGNING_KEY_ALIAS")
    def signingKeyPass = System.getenv("SIGNING_KEY_PASSWORD")

    if (storeFile != null && storePass != null && signingKeyAlias != null && signingKeyPass != null) {
        signingConfigs {
            release {
                storeFile file(storeFile)
                storePassword storePass
                keyAlias signingKeyAlias
                keyPassword signingKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
            def releaseCfg = signingConfigs.findByName("release")
            if (releaseCfg != null) {
                signingConfig releaseCfg
            }
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.15"
    }

    // Keep app bytecode on Java 17 even when Gradle itself runs on a newer host JDK.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Unit tests run on the JVM without the Android framework. Stub Log/etc. and
    // provide a real org.json implementation so JSONObject is usable in tests.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

    implementation platform("androidx.compose:compose-bom:2024.06.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.navigation:navigation-compose:2.7.7"

    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

    implementation "androidx.biometric:biometric:1.1.0"

    // Google Play Billing Library
    implementation "com.android.billingclient:billing-ktx:7.1.1"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:5.3.1"
    // Real org.json for JVM unit tests (android.jar stubs throw by default).
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"

    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"
}
