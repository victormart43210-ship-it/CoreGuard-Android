name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and Attest Release AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      COREGUARD_ANDROID_BUILD: "true"
      # COREGUARD_REQUIRE_RELEASE_SIGNING is set only on the signed build step.
      # Setting it job-wide breaks :app:testDebugUnitTest / :app:lintRelease
      # because those configure the project before the keystore is decoded.

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          # (yes || true): avoid SIGPIPE-induced pipefail failure on license accept.
          (yes || true) | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.31.5"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Require signing secrets for production release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing required secret: $v" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run unit tests + lintRelease
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease --no-daemon --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"

      - name: Build release APK + AAB
        env:
          COREGUARD_REQUIRE_RELEASE_SIGNING: "true"
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            --no-daemon --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Compute SHA-256 checksum
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          test -n "$AAB"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
          sha256sum "$AAB" | tee app/build/outputs/bundle/release/checksums-sha256.txt

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.AAB_PATH }}

      - name: Upload release AAB, mapping, native symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-aab-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/checksums-sha256.txt
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/**
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CoreGuard ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/checksums-sha256.txt
          body: |
            ## Verification

            **Package name:** `com.coldboar.coreguard`

            Verify the SHA-256 checksum in `checksums-sha256.txt` against the downloaded AAB.
            Artifact attestation:

            ```
            gh attestation verify <AAB file> --repo ${{ github.repository }}
            ```

            Built from `${{ github.ref_name }}` —
            [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            See [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md)
            and [docs/CERTIFICATES.md](https://github.com/${{ github.repository }}/blob/main/docs/CERTIFICATES.md).
