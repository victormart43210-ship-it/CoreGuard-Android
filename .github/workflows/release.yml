name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and Attest Release AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      COREGUARD_ANDROID_BUILD: "true"
      # COREGUARD_REQUIRE_RELEASE_SIGNING is set only on the signed build step.
      # Setting it job-wide breaks :app:testDebugUnitTest / :app:lintRelease
      # because those configure the project before the keystore is decoded.

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          # (yes || true): avoid SIGPIPE-induced pipefail failure on license accept.
          (yes || true) | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.31.5"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Require signing secrets for production release
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_STORE_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "Missing required secret: $v" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run unit tests + lintRelease
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease --no-daemon --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"

      - name: Build release APK + AAB
        env:
          COREGUARD_REQUIRE_RELEASE_SIGNING: "true"
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            --no-daemon --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"

      - name: Compute SHA-256 checksum
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          test -n "$AAB"
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"
          sha256sum "$AAB" | tee app/build/outputs/bundle/release/checksums-sha256.txt

      - name: Generate artifact attestation
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.AAB_PATH }}

      # Generating provenance is not the same as proving it. Verify the
      # attestation against the exact AAB before anything downstream treats the
      # artifact as releasable. No `continue-on-error` and no `|| true`: a failed
      # or absent attestation must stop release processing.
      - name: Verify build provenance attestation
        id: verify_attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${AAB_PATH:-}"
          test -f "$AAB_PATH"

          echo "Verifying attestation for $AAB_PATH"
          echo "Expected signer repository: ${{ github.repository }}"

          # --repo pins the identity: an attestation from any other repository
          # must not satisfy this gate.
          gh attestation verify "$AAB_PATH" --repo "${{ github.repository }}"

          echo "provenance_verified=VERIFIED" >> "$GITHUB_OUTPUT"
          {
            echo "## Build provenance"
            echo ""
            echo "- **Attestation verification:** \`VERIFIED\`"
            echo "- **Artifact:** \`$(basename "$AAB_PATH")\`"
            echo "- **Signer repository:** \`${{ github.repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failed provenance verification
        if: failure() && steps.verify_attestation.outcome == 'failure'
        run: |
          {
            echo "## Build provenance"
            echo ""
            echo "- **Attestation verification:** \`FAILED\`"
            echo ""
            echo "Release processing stopped. The artifact is not treated as verified."
          } >> "$GITHUB_STEP_SUMMARY"

      # Emitted only from authoritative step evidence above. Absent evidence
      # stays UNKNOWN/NOT_VERIFIED; the generator recomputes the digest and
      # fails on any mismatch rather than rewriting it.
      - name: Generate release evidence manifest
        id: release_manifest
        run: |
          set -euo pipefail
          EXPECTED_DIGEST=$(awk '{print $1}' \
            app/build/outputs/bundle/release/checksums-sha256.txt | head -n 1)

          python3 scripts/ci/generate_release_manifest.py \
            --repository "${{ github.repository }}" \
            --commit-sha "${{ github.sha }}" \
            --artifact "$AAB_PATH" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --expected-sha256 "$EXPECTED_DIGEST" \
            --provenance-verified "${{ steps.verify_attestation.outputs.provenance_verified }}" \
            --build-status PASS \
            --security-gate-status "${{ vars.RELEASE_SECURITY_GATE_STATUS || 'UNKNOWN' }}" \
            --output app/build/outputs/bundle/release/release-manifest.json

          {
            echo "## Release evidence manifest"
            echo ""
            echo '```json'
            cat app/build/outputs/bundle/release/release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release AAB, mapping, native symbols
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-aab-${{ github.ref_name }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/checksums-sha256.txt
            app/build/outputs/bundle/release/release-manifest.json
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/**
          if-no-files-found: warn
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: "CoreGuard ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/bundle/release/checksums-sha256.txt
            app/build/outputs/bundle/release/release-manifest.json
          body: |
            ## Verification

            **Package name:** `com.coldboar.coreguard`

            Verify the SHA-256 checksum in `checksums-sha256.txt` against the downloaded AAB.
            Artifact attestation:

            ```
            gh attestation verify <AAB file> --repo ${{ github.repository }}
            ```

            Built from `${{ github.ref_name }}` —
            [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            See [SECURITY.md](https://github.com/${{ github.repository }}/blob/main/SECURITY.md)
            and [docs/CERTIFICATES.md](https://github.com/${{ github.repository }}/blob/main/docs/CERTIFICATES.md).
