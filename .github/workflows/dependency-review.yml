name: Dependency review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Dependency review
        id: review
        # Fail closed: Dependency Graph must be enabled and the review must succeed.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Record dependency review outcome
        if: always()
        run: |
          {
            echo "## Dependency review"
            if [ "${{ steps.review.outcome }}" = "success" ]; then
              echo "PASS — dependency review completed (fail-on-severity: high)."
            else
              echo "FAIL — dependency review did not succeed (outcome=${{ steps.review.outcome }})."
              echo "Enable Dependency Graph: Settings → Security → Code security and analysis."
              echo "This job is merge-blocking; soft-fail was removed per security audit."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
