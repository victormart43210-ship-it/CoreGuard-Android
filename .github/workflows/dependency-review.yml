name: Dependency review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        id: review
        # Soft-fail until the repository owner enables Dependency Graph
        # (Settings → Security → Code security and analysis → Dependency graph).
        # This failure is environmental, not a dependency finding.
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - name: Explain soft-fail when Dependency Graph is disabled
        if: always()
        run: |
          {
            echo "## Dependency review"
            if [ "${{ steps.review.outcome }}" = "success" ]; then
              echo "PASS — dependency review completed (fail-on-severity: high)."
            else
              echo "ADVISORY / ENVIRONMENTAL — dependency review did not run successfully."
              echo "Likely cause: Dependency Graph disabled for this repository."
              echo "Enable: Settings → Security → Code security and analysis → Dependency graph"
              echo "Until enabled, treat this job as an environmental soft-fail — not a green security signal."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.review.outcome }}" = "failure" ]; then
            echo "::warning::Dependency review did not run (likely Dependency Graph disabled)."
          fi
