name: Dependency review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        id: review
        # Soft-fail until the repository owner enables Dependency Graph
        # (Settings → Security → Code security and analysis → Dependency graph).
        # This failure is environmental, not a dependency finding.
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
      - name: Explain soft-fail when Dependency Graph is disabled
        if: steps.review.outcome == 'failure'
        run: |
          echo "::warning::Dependency review did not run (likely Dependency Graph disabled)."
          echo "Enable: Settings → Security → Code security and analysis → Dependency graph"
          echo "Then re-run this workflow. Until then, treat this check as environmental soft-fail."
