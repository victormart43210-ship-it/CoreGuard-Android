# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Black Duck Security Action allows you to integrate Static Analysis Security Testing (SAST) and Software Composition Analysis (SCA) into your CI/CD pipelines.
# For more information about configuring your workflow,
# read our documentation at https://github.com/blackduck-inc/black-duck-security-scan

name: CI Black Duck security scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '24 2 * * 1'

jobs:
  # Emit a clear summary when no backend is configured so CI is transparent.
  skipped-notice:
    name: Black Duck (no backend configured)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      vars.BLACKDUCKSCA_URL == '' &&
      vars.COVERITY_URL == '' &&
      vars.POLARIS_SERVER_URL == '' &&
      vars.SRM_URL == ''
    steps:
      - name: Write step summary
        run: |
          echo "## ⏭️ Black Duck scan skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No Black Duck backend is configured for this repository." >> "$GITHUB_STEP_SUMMARY"
          echo "To enable scanning, configure one of the following repository variables:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`BLACKDUCKSCA_URL\` + secret \`BLACKDUCKSCA_TOKEN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`COVERITY_URL\` + secrets \`COVERITY_USER\` / \`COVERITY_PASSPHRASE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`POLARIS_SERVER_URL\` + secret \`POLARIS_ACCESS_TOKEN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`SRM_URL\` + secret \`SRM_API_KEY\`" >> "$GITHUB_STEP_SUMMARY"

  build:
    # Skip this job entirely when no Black Duck scan service is configured,
    # rather than failing with a hard error.
    if: |
      vars.BLACKDUCKSCA_URL != '' ||
      vars.COVERITY_URL != '' ||
      vars.POLARIS_SERVER_URL != '' ||
      vars.SRM_URL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Black Duck SCA scan
        uses: blackduck-inc/black-duck-security-scan@152247222aa9cd38124acd5c0cf60f4db71adc3f
        with:
          ### ---------- BLACKDUCK SCA SCANNING: REQUIRED FIELDS ----------
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}

          ### ---------- COVERITY SCANNING: REQUIRED FIELDS ----------
          coverity_url: ${{ vars.COVERITY_URL }}
          coverity_user: ${{ secrets.COVERITY_USER }}
          coverity_passphrase: ${{ secrets.COVERITY_PASSPHRASE }}

          ### ---------- POLARIS SCANNING: REQUIRED FIELDS ----------
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SCA,SAST"

          ### ---------- SRM SCANNING: REQUIRED FIELDS ----------
          srm_url: ${{ vars.SRM_URL }}
          srm_apikey: ${{ secrets.SRM_API_KEY }}
          srm_assessment_types: "SCA,SAST"
