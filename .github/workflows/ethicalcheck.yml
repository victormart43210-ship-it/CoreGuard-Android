name: EthicalCheck-Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '16 16 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Trigger_EthicalCheck:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read

    steps:
      - name: EthicalCheck Free & Automated API Security Testing Service (best effort)
        id: ethicalcheck
        continue-on-error: true
        uses: Octota-GitHub/ethicalcheck-action@3ec5e93b42e591349e46635da9f909bac66c23a9
        with:
          oas-url: "http://netbanking.apisec.ai:8080/v2/api-docs"
          email: "xxx@apisec.ai"
          sarif-result-file: "ethicalcheck-results.sarif"

      - name: Record EthicalCheck advisory outcome
        if: always()
        run: |
          {
            echo "## EthicalCheck (best-effort external service)"
            if [ "${{ steps.ethicalcheck.outcome }}" = "success" ] && [ -f ethicalcheck-results.sarif ]; then
              echo "PASS — SARIF produced by external EthicalCheck service."
            else
              echo "ADVISORY — EthicalCheck did not complete or produce SARIF."
              echo "This check is non-blocking because it depends on an external service,"
              echo "not on CoreGuard repository code correctness."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn when SARIF was not produced
        if: hashFiles('ethicalcheck-results.sarif') == ''
        run: |
          echo "::warning::EthicalCheck did not produce ethicalcheck-results.sarif."
          echo "::warning::Verify workflow inputs or external EthicalCheck service availability."

      - name: Upload SARIF file to repository
        if: hashFiles('ethicalcheck-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./ethicalcheck-results.sarif
