name: CodeQL

# Static analysis for the CoreGuard Android security surfaces.
# Kotlin (java-kotlin) is REQUIRED coverage; cpp (NDK) is best-effort and must
# never break required Kotlin coverage. The fail-closed invariant
# (java-kotlin must be analyzed with build-mode != none) is enforced
# pre-flight by scripts/ci/verify_codeql_coverage.py in the Android CI job.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # java-kotlin is the required leg; cpp is analyzed where supported and
        # must not block Kotlin coverage (see codeql-config.yml build-mode).
        language: [java-kotlin, cpp]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
