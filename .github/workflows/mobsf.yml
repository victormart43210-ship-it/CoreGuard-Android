# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MobSF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '26 12 * * 2'

permissions:
  contents: read

jobs:
  mobile-security:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.8

      - name: Run mobsfscan
        id: mobsf
        continue-on-error: true
        uses: MobSF/mobsfscan@ec2927a8cfab6626a67f26b223be3aba52a34b70
        with:
          args: '. --sarif --output results.sarif'

      # Interprets execution truth and findings truth as two independent facts.
      # SARIF existence alone is not a result: a crashed or timed-out scanner
      # that leaves a well-formed empty report is reported as FAILED/UNAVAILABLE
      # with findings UNKNOWN, never as a clean scan. Blocking findings fail this
      # step even though the gate is ADVISORY for scanner infrastructure faults.
      - name: Interpret MobSF result truthfully
        id: mobsf_truth
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/ci/mobsf_truthfulness.py \
            --sarif results.sarif \
            --scanner-outcome "${{ steps.mobsf.outcome }}" \
            --classification ADVISORY \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload mobsfscan report
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035871441bd52efbe39e27e # codeql-action@v3.28.19
        with:
          sarif_file: results.sarif
