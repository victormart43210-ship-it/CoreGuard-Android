# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: MobSF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '26 12 * * 2'

permissions:
  contents: read

jobs:
  mobile-security:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Run mobsfscan
        id: mobsf
        continue-on-error: true
        uses: MobSF/mobsfscan@ec2927a8cfab6626a67f26b223be3aba52a34b70
        with:
          args: '. --sarif --output results.sarif'

      - name: Record MobSF advisory outcome
        if: always()
        run: |
          {
            echo "## MobSF static scan (best-effort)"
            if [ -f results.sarif ]; then
              echo "PASS — SARIF written to results.sarif"
            else
              echo "ADVISORY — MobSF did not produce results.sarif (external action / scanner issue)."
              echo "This job stays non-blocking for scanner tooling failures;"
              echo "repository-owned Android/Quilla gates remain required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mobsfscan report
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
