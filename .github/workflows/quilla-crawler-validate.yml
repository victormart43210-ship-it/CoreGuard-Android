name: Quilla Defensive Crawler — Python Validation

on:
  push:
    paths:
      - 'tools/quilla-defensive-crawler/**'
      - '.github/workflows/quilla-crawler-validate.yml'
  pull_request:
    paths:
      - 'tools/quilla-defensive-crawler/**'
      - '.github/workflows/quilla-crawler-validate.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: tools/quilla-defensive-crawler

jobs:
  validate:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: tools/quilla-defensive-crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint
        run: python -m ruff check quilla_crawler/ tests/

      - name: Ruff format check
        run: python -m ruff format --check quilla_crawler/ tests/

      - name: Mypy type-check
        id: mypy
        continue-on-error: true  # Advisory only (project decision); still surface results.
        run: python -m mypy quilla_crawler/ --ignore-missing-imports

      - name: Record mypy advisory outcome
        if: always()
        run: |
          {
            echo "## Quilla mypy (advisory)"
            if [ "${{ steps.mypy.outcome }}" = "success" ]; then
              echo "PASS — mypy reported no issues."
            else
              echo "ADVISORY FAIL — mypy reported type issues; pytest/Ruff remain required gates."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pytest (no internet access required — fixtures only)
        run: python -m pytest tests/ -v --tb=short
        env:
          # Ensure no key is set — tests must not attempt signing.
          QUILLA_SIGNING_KEY_PATH: ""

      - name: Dry-run bundle generation (offline-safe)
        run: |
          set -euo pipefail
          TMPDIR=$(mktemp -d)
          python -m quilla_crawler generate-key \
            --private "$TMPDIR/private.pem" \
            --public  "$TMPDIR/public.pem"
          # Dry-run builds a schema-valid bundle without requiring live network.
          # Signing is skipped; the throwaway private key is deleted below.
          QUILLA_SIGNING_KEY_PATH="$TMPDIR/private.pem" \
          python -m quilla_crawler crawl \
            --config source_allowlist.json \
            --output "$TMPDIR/output/" \
            --dry-run \
            --max-pages 1
          test -f "$TMPDIR/output/quilla-intel.json"
          test -f "$TMPDIR/output/quilla-intel-manifest.json"
          rm -f "$TMPDIR/private.pem"
          if [ -f "$TMPDIR/private.pem" ]; then
            echo "ERROR: private key was not deleted" >&2
            exit 1
          fi
          echo "Dry-run completed; temporary private key removed."
        env:
          # Never use a production key in CI.
          QUILLA_SIGNING_KEY_PATH: ""
