name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  cli:
    name: Go CLI (race + vet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/coreguard-cli ./cmd/coreguard

  threat-intel-policy:
    name: Threat-intel policy + schema checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate allowlist/rules schema
        run: python3 scripts/threat_intel/validate_configs.py
      - name: Build deterministic threat-intel artifact bundle
        run: python3 scripts/threat_intel/ingest_open_sources.py --deterministic
      - name: Train deterministic baseline model scaffold
        run: python3 scripts/threat_intel/train_baseline_model.py --deterministic
      - name: Run threat-intel unit tests
        run: python3 -m unittest scripts.tests.test_threat_intel_pipeline
      - name: Enforce duplicate-dependency guardrail
        run: python3 scripts/threat_intel/check_gradle_dependencies.py

  build:
    name: Android validation (real build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      COREGUARD_ANDROID_BUILD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          # (yes || true): sdkmanager closes stdin when done, killing `yes` with
          # SIGPIPE (exit 141) — under pipefail that would fail the step spuriously.
          (yes || true) | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.31.5"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: lintDebug
        run: ./gradlew :app:lintDebug --stacktrace

      - name: testDebugUnitTest
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: assembleRelease
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: verifyNoPlaceholderApk
        run: |
          set -euo pipefail
          ./gradlew :app:verifyNoPlaceholderApk --stacktrace
          if grep -R "offlineFallback" app/build/outputs/apk 2>/dev/null; then
            echo "Placeholder metadata found under outputs/apk" >&2
            exit 1
          fi
          {
            echo "## Android validation"
            echo "PASS — lintDebug, testDebugUnitTest, assembleDebug, assembleRelease, verifyNoPlaceholderApk"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-validation-evidence
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/reports/problems/**
            **/hs_err_pid*.log

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumented:
    name: Instrumentation (API 36 ATD)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      COREGUARD_ANDROID_BUILD: "true"
      COREGUARD_REQUIRE_KVM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          set -euo pipefail
          echo "=== KVM preflight (before) ==="
          ls -la /dev/kvm 2>&1 || true
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm does not exist on this runner." >&2
            exit 1
          fi
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm exists but is not a character device." >&2
            stat /dev/kvm >&2 || true
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # udev alone is not always enough on GitHub-hosted runners; force mode.
          sudo chmod 0666 /dev/kvm
          echo "=== KVM preflight (after chmod) ==="
          ls -la /dev/kvm
          id; groups || true
          if [[ ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm still not writable after udev + chmod 0666." >&2
            echo "Runner diagnostics:" >&2
            uname -a >&2 || true
            cat /proc/cpuinfo | head -20 >&2 || true
            exit 1
          fi
          echo "KVM available and writable."
      - name: Install SDK + emulator packages
        run: |
          set -euo pipefail
          # (yes || true): avoid SIGPIPE-induced pipefail failure; see build job note.
          (yes || true) | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724" \
            "cmake;3.31.5" \
            "emulator" \
            "platform-tools" \
            "system-images;android-36;google_apis_playstore;x86_64"
      - name: Create AVD and run Quilla emulator gate
        env:
          # Pin one AVD directory so avdmanager (writer) and emulator (reader)
          # cannot disagree; a mismatch previously created an AVD that
          # `avdmanager list avd` could see but `emulator` could not.
          ANDROID_AVD_HOME: ${{ github.workspace }}/.android-avd
        run: |
          set -euo pipefail
          chmod +x ./gradlew ./scripts/quilla-emulator-tests.sh ./scripts/smoke-adb.sh ./scripts/run-emulator.sh
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/avdmanager" create avd \
            -n CoreGuard_ATD36 \
            -k "system-images;android-36;google_apis_playstore;x86_64" \
            -d pixel_6 --force
          # Fail closed immediately if creation did not materialize the AVD,
          # instead of discovering it later as an emulator boot timeout.
          if [ ! -f "$ANDROID_AVD_HOME/CoreGuard_ATD36.ini" ]; then
            echo "::error::AVD ini missing at $ANDROID_AVD_HOME/CoreGuard_ATD36.ini after avdmanager create." >&2
            echo "ANDROID_AVD_HOME contents:" >&2; ls -la "$ANDROID_AVD_HOME" >&2 || true
            exit 1
          fi
          # The emulator's own view is authoritative for launching.
          if ! "${ANDROID_SDK_ROOT}/emulator/emulator" -list-avds | grep -qx 'CoreGuard_ATD36'; then
            echo "::error::emulator -list-avds does not report CoreGuard_ATD36." >&2
            "${ANDROID_SDK_ROOT}/emulator/emulator" -list-avds >&2 || true
            exit 1
          fi
          echo "AVD CoreGuard_ATD36 verified in $ANDROID_AVD_HOME"
          HEADLESS=1 COREGUARD_REQUIRE_KVM=1 ./scripts/quilla-emulator-tests.sh
      - name: Upload instrumentation failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api36-instrumentation-evidence
          if-no-files-found: ignore
          path: |
            /tmp/quilla-emulator-gate/**
            /tmp/coreguard-emulator.log
            /tmp/coreguard-smoke/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
