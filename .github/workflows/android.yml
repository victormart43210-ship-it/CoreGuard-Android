name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  cli:
    name: Go CLI (race + vet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: cli/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o /tmp/coreguard-cli ./cmd/coreguard

  build:
    name: Android validation (real build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Real Android build is default; keep explicit for clarity.
      COREGUARD_ANDROID_BUILD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK components
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint, unit test, assembleDebug, assembleRelease
        run: |
          ./gradlew \
            :app:lintDebug \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease \
            --stacktrace

      - name: Reject placeholder / tiny fake APK
        run: |
          ./gradlew :app:verifyNoPlaceholderApk --stacktrace
          if grep -R "offlineFallback" app/build/outputs/apk 2>/dev/null; then
            echo "Placeholder metadata found under outputs/apk" >&2
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumented:
    name: Instrumentation (API 35 ATD)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      COREGUARD_ANDROID_BUILD: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK + emulator packages
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" \
            "emulator" \
            "platform-tools" \
            "system-images;android-35;google_apis_playstore;x86_64"
      - name: Create AVD and run Quilla emulator gate
        run: |
          chmod +x ./gradlew ./scripts/quilla-emulator-tests.sh ./scripts/smoke-adb.sh || true
          echo no | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/avdmanager create avd \
            -n CoreGuard_ATD35 \
            -k "system-images;android-35;google_apis_playstore;x86_64" \
            -d pixel_6 --force || true
          HEADLESS=1 ./scripts/quilla-emulator-tests.sh
        continue-on-error: true
