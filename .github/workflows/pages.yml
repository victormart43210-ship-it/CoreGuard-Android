name: Deploy privacy policy (GitHub Pages)

on:
  push:
    branches: ["main"]
    paths:
      - "docs/privacy-policy.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp docs/privacy-policy.html _site/privacy-policy.html
          printf '%s\n' '<!DOCTYPE html><meta http-equiv="refresh" content="0;url=privacy-policy.html"><a href="privacy-policy.html">Privacy Policy</a>' > _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
