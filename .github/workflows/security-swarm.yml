name: Security Swarm CI

# Multi-agent CI swarm for code auditing (MASVS / vuln / RASP).
# Architecture & use-case matrix: docs/SWARM_ARCHITECTURE.md
#
# ---------------------------------------------------------------------------
# Trigger: same gates as the main Android CI, plus manual dispatch.
# ---------------------------------------------------------------------------
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Least-privilege permissions: agents only read code; gatekeeper writes a
# PR comment via the built-in GITHUB_TOKEN.
permissions:
  contents: read
  pull-requests: write

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Agent 1 — MASVS Compliance
  # Audits source code against OWASP MASVS rules (storage, crypto, network,
  # code quality, and resilience requirements).
  # ─────────────────────────────────────────────────────────────────────────
  agent-masvs:
    name: "🔍 Agent 1 · MASVS Compliance"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run MASVS compliance agent
        run: |
          python scripts/agents/masvs_agent.py . \
            --json-out /tmp/masvs_report.json

      - name: Upload MASVS report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: masvs-report
          path: /tmp/masvs_report.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Agent 2 — Static Vulnerability Scanner
  # Searches for hard-coded credentials, weak crypto, dangerous WebView
  # settings, SQL injection patterns, and path traversal risks.
  # ─────────────────────────────────────────────────────────────────────────
  agent-vuln-scan:
    name: "🔎 Agent 2 · Static Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run static vulnerability scanner
        run: |
          python scripts/agents/vuln_scan_agent.py . \
            --json-out /tmp/vuln_report.json

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vuln-report
          path: /tmp/vuln_report.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Agent 3 — RASP / ASM Auditor
  # Verifies ProGuard/R8 configuration, native library hardening flags,
  # NativeTamperGuard JNI bridge completeness, backup policy, and network
  # security configuration.
  # ─────────────────────────────────────────────────────────────────────────
  agent-rasp-audit:
    name: "🛡️  Agent 3 · RASP / ASM Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run RASP / ASM auditor
        run: |
          python scripts/agents/rasp_audit_agent.py . \
            --json-out /tmp/rasp_report.json

      - name: Upload RASP audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rasp-report
          path: /tmp/rasp_report.json
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  # Agent 4 — PR Gatekeeper
  # Downloads all agent reports, aggregates findings into a single Markdown
  # summary, posts it to the PR (on pull_request events), and fails the
  # overall workflow if any agent raised a FAIL severity finding.
  # ─────────────────────────────────────────────────────────────────────────
  agent-pr-gatekeeper:
    name: "🚦 Agent 4 · PR Gatekeeper"
    runs-on: ubuntu-latest
    # Always run so the summary is produced even when an agent job fails.
    if: always()
    needs:
      - agent-masvs
      - agent-vuln-scan
      - agent-rasp-audit

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Download MASVS report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: masvs-report
          path: /tmp/reports
        continue-on-error: true

      - name: Download vulnerability report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vuln-report
          path: /tmp/reports
        continue-on-error: true

      - name: Download RASP audit report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rasp-report
          path: /tmp/reports
        continue-on-error: true

      # Write a durable gate-summary.md for the PR comment step.
      # Do NOT read $GITHUB_STEP_SUMMARY from a later step — Actions clears /
      # harvests that file between steps, which produced empty PR comments
      # (GitHub API 422: body cannot be blank).
      - name: Aggregate findings and write step summary
        id: gate
        run: |
          python scripts/security_gate.py > gate-summary.md
          cat gate-summary.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Post PR comment with gate decision
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');

            let body = '## 🛡️ Security Swarm Gate\n\nNo report summary available.';

            if (fs.existsSync('gate-summary.md')) {
              const report = fs.readFileSync('gate-summary.md', 'utf8').trim();
              if (report) body = report;
            }

            if (body.length > 65000) {
              body = body.slice(0, 65000) + '\n\n_[truncated]_';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Enforce gate decision
        # Fail this job (and the workflow) if the gatekeeper script exited non-zero.
        if: always() && steps.gate.outcome == 'failure'
        run: |
          echo "::error::Security Swarm gate FAILED — see step summary for details."
          exit 1
